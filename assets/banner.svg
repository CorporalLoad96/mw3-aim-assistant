<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0a0c0d"/>
<stop offset="55%" stop-color="#14181a"/>
<stop offset="100%" stop-color="#1c0d0d"/>
</linearGradient>
<radialGradient id="glow" cx="80%" cy="35%" r="60%">
<stop offset="0%" stop-color="#ff2b2b" stop-opacity="0.35"/>
<stop offset="60%" stop-color="#ff2b2b" stop-opacity="0.05"/>
<stop offset="100%" stop-color="#ff2b2b" stop-opacity="0"/>
</radialGradient>
<linearGradient id="scope" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ff3b3b"/>
<stop offset="100%" stop-color="#8f0f0f"/>
</linearGradient>
<linearGradient id="txt" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#ffffff"/>
