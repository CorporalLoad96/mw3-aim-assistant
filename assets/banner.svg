<g opacity="0.55">
<polygon points="1005,60 1080,60 1120,20 1005,20" fill="#ff2b2b" opacity="0.12"/>
<polygon points="1005,300 1080,300 1120,340 1005,340" fill="#ff2b2b" opacity="0.12"/>
</g>

<g opacity="0.5" stroke="#ff3b3b" stroke-width="1.4">
<polyline points="40,300 90,300 110,280" fill="none"/>
<polyline points="40,320 70,320 90,300" fill="none"/>
<polyline points="40,60 90,60 110,80" fill="none"/>
