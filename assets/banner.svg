</g>

<text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="72" fill="url(#txt)" textLength="900" lengthAdjust="spacingAndGlyphs">
Call Of Duty MW3
</text>
<text x="60" y="228" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="72" fill="url(#txt)" textLength="440" lengthAdjust="spacingAndGlyphs">
Softaim
</text>

<text x="60" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#d8d8d8" textLength="760" lengthAdjust="spacingAndGlyphs">
Pluggable softaim module for the Call of Duty MW3 ecosystem
