<circle r="60" fill="none" stroke="url(#scope)" stroke-width="2.5"/>
<line x1="-150" y1="0" x2="-70" y2="0" stroke="#ff3b3b" stroke-width="3"/>
<line x1="70" y1="0" x2="150" y2="0" stroke="#ff3b3b" stroke-width="3"/>
<line x1="0" y1="-150" x2="0" y2="-70" stroke="#ff3b3b" stroke-width="3"/>
<line x1="0" y1="70" x2="0" y2="150" stroke="#ff3b3b" stroke-width="3"/>
<circle r="4" fill="#ff3b3b"/>
<circle r="5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
